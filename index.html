<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌇 Apartment Hunt</title>
<style>
  :root {
    --top-pick: #e03e3e;
    --very: #dfab01;
    --somewhat: #337ea9;
    --bg: #faf9f7;
    --card: #ffffff;
    --text: #2f2f2f;
    --muted: #767676;
    --border: #e6e4e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    padding: 28px 20px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
  }
  header p {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .nav-link {
    display: inline-block;
    font-size: 0.82rem;
    color: #1c6fd1;
    text-decoration: none;
  }
  .search-row {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 16px;
  }
  .search-row input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 9px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
  }
  .filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 16px 16px;
  }
  .filters button {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .filters button.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .list {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }
  .rating {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    color: #fff;
    white-space: nowrap;
  }
  .rating.top { background: var(--top-pick); }
  .rating.very { background: var(--very); color: #3a2e00; }
  .rating.somewhat { background: var(--somewhat); }
  select.rating {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    outline: none;
    cursor: pointer;
  }
  .rent {
    font-size: 1.15rem;
    font-weight: 700;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .meta span { white-space: nowrap; }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .tag {
    font-size: 0.72rem;
    background: #f1efec;
    border: 1px solid var(--border);
    padding: 2px 9px;
    border-radius: 20px;
    color: var(--text);
  }
  .tag.fee-none { background: #ddf3e4; }
  .tag.fee-low { background: #f0e4fa; }
  .tag.fee-yes { background: #fbe0e0; }
  .tag.fee-water { background: #fbe0ee; }
  .link-btn {
    display: inline-block;
    text-decoration: none;
    background: #111;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    margin-right: 8px;
  }
  .sync-banner {
    max-width: 640px;
    margin: 0 auto 16px;
    padding: 10px 16px;
    background: #fff3cd;
    border: 1px solid #d4a017;
    color: #8a6400;
    font-size: 0.82rem;
    border-radius: 10px;
    text-align: center;
  }
  .contact-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 0.85rem;
  }
  .contact-name {
    color: var(--muted);
  }
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
  }
  .contact-btn.call { background: #eef5ff; color: #1b5fb0; }
  .contact-btn.line { background: #e4faec; color: #06894a; }
  .decision-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .decision-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: #fdfdfc;
    padding: 8px 6px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .decision-btn.selected.take { background: #ddf3e4; border-color: #2b8a3e; color: #1d6b2d; }
  .decision-btn.selected.leave { background: #fbe0e0; border-color: #c92a2a; color: #a61e1e; }
  .decision-btn.selected.unsure { background: #fff3cd; border-color: #d4a017; color: #8a6400; }
  .notes-static {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-style: italic;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .form-row label {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .form-row input[type="date"],
  .form-row textarea {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
    width: 100%;
    background: #fdfdfc;
  }
  .form-row textarea {
    min-height: 54px;
    resize: vertical;
  }
  .remove-btn {
    display: block;
    margin-top: 10px;
    border: none;
    background: none;
    color: #c92a2a;
    font-size: 0.78rem;
    cursor: pointer;
    padding: 0;
  }
  .edit-toggle-btn {
    display: inline-block;
    margin-top: 10px;
    margin-right: 14px;
    border: none;
    background: none;
    color: #1c6fd1;
    font-size: 0.78rem;
    cursor: pointer;
    padding: 0;
  }
  .edit-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fafaf7;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 10px 0;
  }
  .edit-panel input,
  .edit-panel select,
  .edit-panel textarea {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
    width: 100%;
    background: #fdfdfc;
  }
  .edit-panel textarea { min-height: 50px; resize: vertical; }
  .edit-actions {
    display: flex;
    gap: 10px;
  }
  .edit-save {
    border: none;
    background: #111;
    color: #fff;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .edit-cancel {
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .add-section {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px 16px;
  }
  .add-toggle {
    display: block;
    width: 100%;
    border: 1px dashed var(--border);
    background: var(--card);
    padding: 10px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .add-panel {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-top: 12px;
  }
  .add-panel.open { display: flex; }
  .add-panel input,
  .add-panel select,
  .add-panel textarea {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    font-family: inherit;
    width: 100%;
    background: #fdfdfc;
  }
  .add-panel textarea { min-height: 50px; resize: vertical; }
  .add-submit {
    border: none;
    background: #111;
    color: #fff;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .saved-badge {
    font-size: 0.72rem;
    color: #2b8a3e;
    margin-top: 6px;
    display: none;
  }
  .saved-badge.show { display: inline-block; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 30px;
  }
</style>
</head>
<body>

<header>
  <h1>🌇 Apartment Hunt</h1>
  <p>Tap a 591 link to see the listing. Ratings, notes, dates, and decisions sync automatically between your phone and computer. 💛</p>
  <a class="nav-link" href="appointments.html">📅 View appointment schedule →</a>
</header>

<div class="sync-banner" id="sync-banner" style="display:none;"></div>

<div class="search-row">
  <input type="text" id="search-input" placeholder="🔍 Paste a 591 link, or search by ID, area, or contact name...">
</div>

<div class="filters" id="filters">
  <button data-filter="All" class="active">All</button>
  <button data-filter="Top pick">Top pick</button>
  <button data-filter="Very interested">Very interested</button>
  <button data-filter="Somewhat interested">Somewhat interested</button>
</div>

<div class="filters" id="decision-filters">
  <button data-decision="All" class="active">All decisions</button>
  <button data-decision="take">✅ Take it</button>
  <button data-decision="leave">❌ Leave it</button>
  <button data-decision="unsure">🤔 Not sure</button>
</div>

<div class="filters" id="neighborhood-filters"></div>

<div class="add-section">
  <button class="add-toggle" id="add-toggle">+ Add a new place</button>
  <form class="add-panel" id="add-form">
    <div class="form-row">
      <label for="new-link">Listing link (591 or any site)</label>
      <input type="url" id="new-link" placeholder="https://rent.591.com.tw/123456">
    </div>
    <div class="form-row">
      <label for="new-neighborhood">Neighborhood</label>
      <input type="text" id="new-neighborhood" placeholder="e.g. Xindian" list="neighborhood-options">
      <datalist id="neighborhood-options">
        <option value="Xindian"></option>
        <option value="Shenkeng"></option>
      </datalist>
    </div>
    <div class="form-row">
      <label for="new-rent">Rent (NT$)</label>
      <input type="number" id="new-rent" placeholder="e.g. 12000">
    </div>
    <div class="form-row">
      <label for="new-sqft">Size (坪)</label>
      <input type="number" id="new-sqft" placeholder="e.g. 8">
    </div>
    <div class="form-row">
      <label for="new-level">Floor</label>
      <input type="text" id="new-level" placeholder="e.g. 3F">
    </div>
    <div class="form-row">
      <label for="new-owner">Owner or agent?</label>
      <select id="new-owner">
        <option value="Owner">Owner</option>
        <option value="Agent">Agent</option>
      </select>
    </div>
    <div class="form-row">
      <label for="new-contact-name">Contact name</label>
      <input type="text" id="new-contact-name" placeholder="e.g. 王先生">
    </div>
    <div class="form-row">
      <label for="new-phone">Contact phone</label>
      <input type="tel" id="new-phone" placeholder="e.g. 0972-528-577">
    </div>
    <div class="form-row">
      <label for="new-rating">Rating</label>
      <select id="new-rating">
        <option value="Top pick">Top pick</option>
        <option value="Very interested">Very interested</option>
        <option value="Somewhat interested" selected>Somewhat interested</option>
      </select>
    </div>
    <div class="form-row">
      <label for="new-notes">Notes</label>
      <textarea id="new-notes" placeholder="anything worth remembering"></textarea>
    </div>
    <button type="submit" class="add-submit">Add this place</button>
  </form>
</div>

<div class="list" id="list"></div>

<footer>Made with 💛 for apartment hunting </footer>

<script>
const listings = [
  { id: "22109937", rating: "Top pick", neighborhood: "Xindian", rent: 12000, sqft: 5, level: "3F/4F", owner: "Owner", fee: "No-Fee", elevator: false, features: ["washing machine","Water Machine","rent-stabilized"], notes: "", contactName: "曾小姐", phoneDisplay: "0972-528-577 ext 4726653", tel: "0972528577,4726653" },
  { id: "22100813", rating: "Very interested", neighborhood: "Xindian", rent: 12500, sqft: 10, level: "2F/3F", owner: "Owner", fee: "Water Free", elevator: false, features: ["washing machine (share)"], notes: "", contactName: "龔女士", phoneDisplay: "0935-920-910", tel: "0935920910" },
  { id: "22097513", rating: "Very interested", neighborhood: "Xindian", rent: 13500, sqft: 8, level: "", owner: "Agent", fee: "", elevator: false, features: ["washing machine","Water Machine"], notes: "", contactName: "崔小姐", phoneDisplay: "0918-666-444", tel: "0918666444", lineId: "0918666444", lineType: "personal" },
  { id: "22135508", rating: "Very interested", neighborhood: "Xindian", rent: 10000, sqft: 5, level: "1F", owner: "Owner", fee: "", elevator: false, features: ["washing machine"], notes: "", contactName: "黃先生", phoneDisplay: "0972-528-577 ext 4725739", tel: "0972528577,4725739" },
  { id: "22100737", rating: "Very interested", neighborhood: "Xindian", rent: 11000, sqft: 8, level: "2F", owner: "Owner", fee: "", elevator: false, features: ["washing machine"], notes: "", contactName: "0先生", phoneDisplay: "0972-528-577 ext 4725751", tel: "0972528577,4725751" },
  { id: "22056915", rating: "Somewhat interested", neighborhood: "Xindian", rent: 8500, sqft: 9, level: "1F", owner: "Owner", fee: "No-Fee", elevator: false, features: [], notes: "", contactName: "呂先生", phoneDisplay: "0988-215-941", tel: "0988215941" },
  { id: "22038129", rating: "Somewhat interested", neighborhood: "Xindian", rent: 8000, sqft: 8, level: "頂層加蓋/1F", owner: "Owner", fee: "No-Fee", elevator: false, features: ["washing machine","rent-stabilized"], notes: "", contactName: "蔡先生", phoneDisplay: "0972-528-577 ext 4718484", tel: "0972528577,4718484" },
  { id: "22101540", rating: "Somewhat interested", neighborhood: "Xindian", rent: 11300, sqft: 6, level: "4F", owner: "Agent", fee: "?", elevator: false, features: ["washing machine"], notes: "", contactName: "張先生", phoneDisplay: "0939-100-187", tel: "0939100187", lineId: "quv4409a", lineType: "official" },
  { id: "22064039", rating: "Somewhat interested", neighborhood: "Xindian", rent: 16800, sqft: null, level: "3F", owner: "Owner", fee: "", elevator: false, features: [], notes: "Shared Bathroom", contactName: "張先生", phoneDisplay: "0920-022-682", tel: "0920022682" },
  { id: "22103904", rating: "Somewhat interested", neighborhood: "Xindian", rent: 8500, sqft: 7, level: "5F", owner: "Owner", fee: "?", elevator: false, features: [], notes: "", contactName: "李小姐", phoneDisplay: "0972-281-522", tel: "0972281522" },
  { id: "22138815", rating: "Somewhat interested", neighborhood: "Xindian", rent: 15000, sqft: 10, level: "6F", owner: "Agent", fee: "Fee", elevator: true, features: [], notes: "Need to pay Agent fee / service fee: half a month's rent", contactName: "游先生 (Eason)", phoneDisplay: "0970-104-204", tel: "0970104204", lineId: "d10220112", lineType: "personal" },
];

const ratingClass = { "Top pick": "top", "Very interested": "very", "Somewhat interested": "somewhat" };
const feeClass = { "No-Fee": "fee-none", "Low-Fee": "fee-low", "Fee": "fee-yes", "Water Free": "fee-water", "?": "" };

// ---- Google Sheets sync ----
// Paste your Apps Script Web App URL here after you finish the setup steps (ends in /exec).
// Until this is filled in, the page falls back to saving on this device only (old behavior).
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyttJJmN_A4xor30xAG-Iis_FHJn6tg8OahFBKyR5xaAFDfbHr9z3OXMsD1wkWhrpw/exec";
const sheetConfigured = () => !!SHEET_API_URL;

let sheetRowsById = {};   // cache of the sheet's rows, keyed by listing ID, filled in by init()
let sheetAvailable = false; // true once we've successfully loaded from the sheet at least once

function indexRows(rows) {
  const map = {};
  rows.forEach(r => { if (r.ID !== undefined && r.ID !== "") map[String(r.ID)] = r; });
  return map;
}

async function fetchSheetData() {
  try {
    const res = await fetch(SHEET_API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("bad response");
    const rows = await res.json();
    return Array.isArray(rows) ? rows : [];
  } catch (e) {
    return null;
  }
}

function postSheetRow(row) {
  if (!sheetConfigured()) return;
  // text/plain avoids a CORS preflight that Apps Script web apps don't handle.
  fetch(SHEET_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(row),
  }).catch(() => { /* silent — local cache below still has the latest value */ });
}

function showSyncBanner(text) {
  const banner = document.getElementById("sync-banner");
  if (!text) { banner.style.display = "none"; return; }
  banner.textContent = text;
  banner.style.display = "block";
}

function sheetRowToListing(r) {
  return {
    id: String(r.ID),
    custom: true,
    rating: r.Rating || "Somewhat interested",
    neighborhood: r.Neighborhood || "",
    rent: Number(r.Rent) || 0,
    sqft: r.Sqft ? Number(r.Sqft) : null,
    level: r.Level || "",
    owner: r.Owner || "",
    fee: "",
    elevator: false,
    features: [],
    notes: r.Notes || "",
    link: r.Link || undefined,
    contactName: r.ContactName || "",
    phoneDisplay: r.PhoneDisplay || undefined,
    tel: r.PhoneDisplay ? String(r.PhoneDisplay).replace(/[^\d,]/g, "") : undefined,
  };
}

const storeKey = id => `apt-hunt-${id}`;

function loadState(id, defaultRating, defaultPreNote) {
  if (sheetAvailable && sheetRowsById[id]) {
    const r = sheetRowsById[id];
    return {
      date: r.Date || "",
      note: r.Note || "",
      preNote: r.PreNote || defaultPreNote || "",
      decision: r.Decision || "",
      rating: r.Rating || defaultRating,
      deleted: r.Deleted === true || r.Deleted === "TRUE" || r.Deleted === "true",
    };
  }
  try {
    const stored = JSON.parse(localStorage.getItem(storeKey(id)));
    return stored || { date: "", note: "", decision: "", rating: defaultRating, preNote: defaultPreNote || "" };
  } catch (e) {
    return { date: "", note: "", decision: "", rating: defaultRating, preNote: defaultPreNote || "" };
  }
}

function saveState(id, state) {
  try {
    localStorage.setItem(storeKey(id), JSON.stringify(state));
  } catch (e) {
    if (!sheetConfigured()) {
      alert("Couldn't save this — your browser is blocking storage on this page (common if you opened the file directly instead of via its https:// link). Try viewing the page through its live GitHub Pages URL instead.");
      return false;
    }
  }
  if (sheetConfigured()) {
    const row = Object.assign({}, sheetRowsById[id], {
      ID: id,
      Rating: state.rating,
      Decision: state.decision,
      Date: state.date,
      Note: state.note,
      PreNote: state.preNote,
      Deleted: !!state.deleted,
    });
    sheetRowsById[id] = row;
    postSheetRow(row);
  }
  return true;
}

const CUSTOM_KEY = "apt-hunt-custom-list";

function loadCustomListings() {
  if (sheetAvailable) {
    return Object.values(sheetRowsById)
      .filter(r => (r.Custom === true || r.Custom === "TRUE") && !listings.some(l => l.id === String(r.ID)))
      .map(sheetRowToListing);
  }
  try {
    const stored = JSON.parse(localStorage.getItem(CUSTOM_KEY));
    return Array.isArray(stored) ? stored : [];
  } catch (e) {
    return [];
  }
}

function saveCustomListings(arr) {
  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(arr));
    return true;
  } catch (e) {
    alert("Couldn't save this — your browser is blocking storage on this page (common if you opened the file directly instead of via its https:// link). Try viewing the page through its live GitHub Pages URL instead.");
    return false;
  }
}

const ratingOptions = ["Top pick", "Very interested", "Somewhat interested"];
let currentFilter = "All";
let currentDecisionFilter = "All";
let currentNeighborhoodFilter = "All";
let searchQuery = "";
const KNOWN_NEIGHBORHOODS = ["Xindian", "Shenkeng"];

// Lets you paste a 591 link (or just type an ID, area, or contact name) to find
// a listing already in the list. If the query contains a long number (a 591 ID),
// that's matched exactly against the listing's ID; otherwise it's a loose text search.
function matchesSearch(l, query) {
  const q = query.trim().toLowerCase();
  if (!q) return true;
  const idMatch = q.match(/(\d{6,})/);
  if (idMatch && String(l.id) === idMatch[1]) return true;
  const link = l.link || `https://rent.591.com.tw/${l.id}`;
  const haystack = [l.id, link, l.neighborhood, l.contactName, l.notes, l.owner, l.level]
    .filter(Boolean).join(" ").toLowerCase();
  return haystack.includes(q);
}
const editingIds = new Set(); // IDs of custom listings currently showing the edit-details form

function saveListingDetails(l, updates) {
  if (sheetConfigured()) {
    const row = Object.assign({}, sheetRowsById[l.id], {
      ID: l.id,
      Custom: true,
      Neighborhood: updates.neighborhood,
      Rent: updates.rent,
      Sqft: updates.sqft,
      Level: updates.level,
      Owner: updates.owner,
      ContactName: updates.contactName,
      PhoneDisplay: updates.phoneDisplay,
      Tel: updates.phoneDisplay ? updates.phoneDisplay.replace(/[^\d,]/g, "") : "",
      Link: updates.link,
      Notes: updates.notes,
    });
    sheetRowsById[l.id] = row;
    postSheetRow(row);
  } else {
    const custom = loadCustomListings().map(c => {
      if (c.id !== l.id) return c;
      return Object.assign({}, c, {
        neighborhood: updates.neighborhood,
        rent: updates.rent,
        sqft: updates.sqft,
        level: updates.level,
        owner: updates.owner,
        contactName: updates.contactName,
        phoneDisplay: updates.phoneDisplay || undefined,
        tel: updates.phoneDisplay ? updates.phoneDisplay.replace(/[^\d,]/g, "") : undefined,
        link: updates.link || undefined,
        notes: updates.notes,
      });
    });
    saveCustomListings(custom);
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function render() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = "";
  const allListings = [...listings, ...loadCustomListings()];

  // Neighborhood filter buttons are generated dynamically since neighborhoods
  // are free text (not a fixed set like rating/decision) and grow as listings are added.
  // KNOWN_NEIGHBORHOODS are always shown as options even before any listing uses them.
  const neighborhoods = [...new Set([
    ...KNOWN_NEIGHBORHOODS,
    ...allListings.map(l => (l.neighborhood || "").trim()).filter(Boolean),
  ])].sort((a, b) => a.localeCompare(b));
  if (currentNeighborhoodFilter !== "All" && !neighborhoods.includes(currentNeighborhoodFilter)) {
    currentNeighborhoodFilter = "All";
  }
  const nbEl = document.getElementById("neighborhood-filters");
  nbEl.innerHTML = `<button data-neighborhood="All" class="${currentNeighborhoodFilter === "All" ? "active" : ""}">All areas</button>`
    + neighborhoods.map(n => `<button data-neighborhood="${escapeHtml(n)}" class="${currentNeighborhoodFilter === n ? "active" : ""}">📍 ${escapeHtml(n)}</button>`).join("");

  allListings
    .map(l => ({ l, state: loadState(l.id, l.rating, l.notes) }))
    .filter(({ state }) => !state.deleted)
    .filter(({ l, state }) => currentFilter === "All" || (state.rating || l.rating) === currentFilter)
    .filter(({ state }) => currentDecisionFilter === "All" || state.decision === currentDecisionFilter)
    .filter(({ l }) => currentNeighborhoodFilter === "All" || (l.neighborhood || "").trim() === currentNeighborhoodFilter)
    .filter(({ l }) => matchesSearch(l, searchQuery))
    .forEach(({ l, state }) => {
      const card = document.createElement("div");
      card.className = "card";
      const effectiveRating = state.rating || l.rating;
      const link = l.link || `https://rent.591.com.tw/${l.id}`;

      const tagsHtml = (l.features || []).map(f => `<span class="tag">${f}</span>`).join("")
        + (l.fee ? `<span class="tag ${feeClass[l.fee] || ''}">${l.fee}</span>` : "")
        + (l.elevator ? `<span class="tag">🛗 Elevator</span>` : "");

      const isEditing = l.custom && editingIds.has(l.id);

      const detailsHtml = isEditing ? `
        <div class="edit-panel" id="edit-${l.id}">
          <div class="form-row">
            <label for="edit-link-${l.id}">Listing link</label>
            <input type="url" id="edit-link-${l.id}" value="${escapeHtml(l.link || '')}">
          </div>
          <div class="form-row">
            <label for="edit-neighborhood-${l.id}">Neighborhood</label>
            <input type="text" id="edit-neighborhood-${l.id}" value="${escapeHtml(l.neighborhood || '')}" list="neighborhood-options">
          </div>
          <div class="form-row">
            <label for="edit-rent-${l.id}">Rent (NT$)</label>
            <input type="number" id="edit-rent-${l.id}" value="${l.rent || ''}">
          </div>
          <div class="form-row">
            <label for="edit-sqft-${l.id}">Size (坪)</label>
            <input type="number" id="edit-sqft-${l.id}" value="${l.sqft || ''}">
          </div>
          <div class="form-row">
            <label for="edit-level-${l.id}">Floor</label>
            <input type="text" id="edit-level-${l.id}" value="${escapeHtml(l.level || '')}">
          </div>
          <div class="form-row">
            <label for="edit-owner-${l.id}">Owner or agent?</label>
            <select id="edit-owner-${l.id}">
              <option value="Owner" ${l.owner === 'Owner' ? 'selected' : ''}>Owner</option>
              <option value="Agent" ${l.owner === 'Agent' ? 'selected' : ''}>Agent</option>
            </select>
          </div>
          <div class="form-row">
            <label for="edit-contact-name-${l.id}">Contact name</label>
            <input type="text" id="edit-contact-name-${l.id}" value="${escapeHtml(l.contactName || '')}">
          </div>
          <div class="form-row">
            <label for="edit-phone-${l.id}">Contact phone</label>
            <input type="tel" id="edit-phone-${l.id}" value="${escapeHtml(l.phoneDisplay || '')}">
          </div>
          <div class="form-row">
            <label for="edit-notes-${l.id}">Notes</label>
            <textarea id="edit-notes-${l.id}">${escapeHtml(l.notes || '')}</textarea>
          </div>
          <div class="edit-actions">
            <button type="button" class="edit-save" data-edit-save="${l.id}">💾 Save changes</button>
            <button type="button" class="edit-cancel" data-edit-cancel="${l.id}">Cancel</button>
          </div>
        </div>
      ` : `
        <div class="meta">
          ${l.neighborhood ? `<span>📍 ${l.neighborhood}</span>` : ""}
          ${l.sqft ? `<span>${l.sqft} 坪</span>` : ""}
          ${l.level ? `<span>Floor ${l.level}</span>` : ""}
          ${l.owner ? `<span>${l.owner}</span>` : ""}
        </div>
        ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
        <a class="link-btn" href="${link}" target="_blank" rel="noopener">${link.includes('591.com.tw') ? 'View on 591 →' : 'View listing →'}</a>

        ${l.phoneDisplay ? `
        <div class="contact-row">
          <span class="contact-name">${l.contactName || ''} · ${l.phoneDisplay}</span>
          <a class="contact-btn call" href="tel:${l.tel}">📞 Call</a>
          ${l.lineId ? `<a class="contact-btn line" href="https://line.me/${l.lineType === 'official' ? 'R/ti/p/@' : 'ti/p/~'}${l.lineId}" target="_blank" rel="noopener">💬 LINE</a>` : ""}
        </div>` : ""}
      `;

      card.innerHTML = `
        <div class="card-top">
          <select class="rating ${ratingClass[effectiveRating]}" id="rating-${l.id}">
            ${ratingOptions.map(r => `<option value="${r}" ${r === effectiveRating ? 'selected' : ''}>${r}</option>`).join("")}
          </select>
          <span class="rent">NT$${l.rent.toLocaleString()}</span>
        </div>
        ${detailsHtml}

        <div class="form-row">
          <label for="prenote-${l.id}">Notes before visiting</label>
          <textarea id="prenote-${l.id}" placeholder="e.g. far from bus stop, no washing machine...">${state.preNote || ""}</textarea>
        </div>
        <div class="form-row">
          <label for="date-${l.id}">Appointment date</label>
          <input type="date" id="date-${l.id}" value="${state.date}">
        </div>
        <div class="form-row">
          <label for="note-${l.id}">Your notes after visiting</label>
          <textarea id="note-${l.id}" placeholder="e.g. nice light, a bit noisy, landlord was friendly...">${state.note}</textarea>
        </div>

        <div class="form-row">
          <label>Take it or leave it?</label>
          <div class="decision-row" id="decision-${l.id}">
            <button type="button" class="decision-btn take ${state.decision === 'take' ? 'selected take' : ''}" data-decision="take">✅ Take it</button>
            <button type="button" class="decision-btn leave ${state.decision === 'leave' ? 'selected leave' : ''}" data-decision="leave">❌ Leave it</button>
            <button type="button" class="decision-btn unsure ${state.decision === 'unsure' ? 'selected unsure' : ''}" data-decision="unsure">🤔 Not sure</button>
          </div>
        </div>

        <span class="saved-badge" id="saved-${l.id}">Saved ✓</span>
        ${l.custom && !isEditing ? `<button type="button" class="edit-toggle-btn" data-edit-toggle="${l.id}">✏️ Edit details</button>` : ""}
        <button type="button" class="remove-btn" data-remove="${l.id}">✕ Remove from list</button>
      `;
      listEl.appendChild(card);

      const dateInput = card.querySelector(`#date-${l.id}`);
      const noteInput = card.querySelector(`#note-${l.id}`);
      const preNoteInput = card.querySelector(`#prenote-${l.id}`);
      const savedBadge = card.querySelector(`#saved-${l.id}`);
      const decisionRow = card.querySelector(`#decision-${l.id}`);
      const ratingSelect = card.querySelector(`#rating-${l.id}`);
      let currentDecision = state.decision || "";
      let currentRating = effectiveRating;

      const persist = () => {
        saveState(l.id, { date: dateInput.value, note: noteInput.value, preNote: preNoteInput.value, decision: currentDecision, rating: currentRating });
        savedBadge.textContent = sheetConfigured() ? "Synced ☁️" : "Saved on this device ✓";
        savedBadge.classList.add("show");
        clearTimeout(persist._t);
        persist._t = setTimeout(() => savedBadge.classList.remove("show"), 1500);
      };
      dateInput.addEventListener("change", persist);
      noteInput.addEventListener("input", persist);
      preNoteInput.addEventListener("input", persist);

      decisionRow.addEventListener("click", (e) => {
        const btn = e.target.closest(".decision-btn");
        if (!btn) return;
        const clicked = btn.dataset.decision;
        currentDecision = currentDecision === clicked ? "" : clicked;
        decisionRow.querySelectorAll(".decision-btn").forEach(b => {
          b.classList.toggle("selected", b.dataset.decision === currentDecision);
        });
        persist();
        if (currentDecisionFilter !== "All" && currentDecision !== currentDecisionFilter) {
          render();
        }
      });

      ratingSelect.addEventListener("change", () => {
        currentRating = ratingSelect.value;
        ratingSelect.classList.remove("top", "very", "somewhat");
        ratingSelect.classList.add(ratingClass[currentRating]);
        persist();
        if (currentFilter !== "All" && currentRating !== currentFilter) {
          render();
        }
      });

      const removeBtn = card.querySelector(`[data-remove="${l.id}"]`);
      removeBtn.addEventListener("click", () => {
        if (!confirm("Remove this place from the list?")) return;
        if (l.custom && !sheetConfigured()) {
          const updated = loadCustomListings().filter(c => c.id !== l.id);
          saveCustomListings(updated);
          localStorage.removeItem(storeKey(l.id));
        } else {
          saveState(l.id, { ...state, deleted: true });
        }
        render();
      });

      if (l.custom) {
        const editToggleBtn = card.querySelector(`[data-edit-toggle="${l.id}"]`);
        if (editToggleBtn) {
          editToggleBtn.addEventListener("click", () => {
            editingIds.add(l.id);
            render();
          });
        }
        const editSaveBtn = card.querySelector(`[data-edit-save="${l.id}"]`);
        if (editSaveBtn) {
          editSaveBtn.addEventListener("click", () => {
            const updates = {
              link: card.querySelector(`#edit-link-${l.id}`).value.trim(),
              neighborhood: card.querySelector(`#edit-neighborhood-${l.id}`).value.trim(),
              rent: Number(card.querySelector(`#edit-rent-${l.id}`).value) || 0,
              sqft: Number(card.querySelector(`#edit-sqft-${l.id}`).value) || null,
              level: card.querySelector(`#edit-level-${l.id}`).value.trim(),
              owner: card.querySelector(`#edit-owner-${l.id}`).value,
              contactName: card.querySelector(`#edit-contact-name-${l.id}`).value.trim(),
              phoneDisplay: card.querySelector(`#edit-phone-${l.id}`).value.trim(),
              notes: card.querySelector(`#edit-notes-${l.id}`).value.trim(),
            };
            saveListingDetails(l, updates);
            editingIds.delete(l.id);
            render();
          });
        }
        const editCancelBtn = card.querySelector(`[data-edit-cancel="${l.id}"]`);
        if (editCancelBtn) {
          editCancelBtn.addEventListener("click", () => {
            editingIds.delete(l.id);
            render();
          });
        }
      }
    });
}

document.getElementById("filters").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentFilter = e.target.dataset.filter;
  render();
});

document.getElementById("decision-filters").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#decision-filters button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentDecisionFilter = e.target.dataset.decision;
  render();
});

document.getElementById("neighborhood-filters").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  currentNeighborhoodFilter = e.target.dataset.neighborhood;
  render();
});

document.getElementById("search-input").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  render();
});

const addToggle = document.getElementById("add-toggle");
const addPanel = document.getElementById("add-form");
addToggle.addEventListener("click", () => {
  const isOpen = addPanel.classList.toggle("open");
  addToggle.textContent = isOpen ? "✕ Cancel" : "+ Add a new place";
});

addPanel.addEventListener("submit", (e) => {
  e.preventDefault();
  const link = document.getElementById("new-link").value.trim();
  const match = link.match(/(\d{6,})/);
  const id = match ? match[1] : `custom-${Date.now()}`;
  const phoneDisplay = document.getElementById("new-phone").value.trim();

  const existingIds = [...listings, ...loadCustomListings()].map(x => x.id);
  if (match && existingIds.includes(id)) {
    alert("This 591 listing is already in the list!");
    return;
  }

  const neighborhood = document.getElementById("new-neighborhood").value.trim();
  const rent = Number(document.getElementById("new-rent").value) || 0;
  const sqft = Number(document.getElementById("new-sqft").value) || null;
  const level = document.getElementById("new-level").value.trim();
  const owner = document.getElementById("new-owner").value;
  const rating = document.getElementById("new-rating").value;
  const contactName = document.getElementById("new-contact-name").value.trim();
  const notes = document.getElementById("new-notes").value.trim();

  if (sheetConfigured()) {
    const row = {
      ID: id, Custom: true, Rating: rating, Decision: "", Date: "", Note: "", PreNote: "", Deleted: false,
      Neighborhood: neighborhood, Rent: rent, Sqft: sqft, Level: level, Owner: owner,
      ContactName: contactName, PhoneDisplay: phoneDisplay, Tel: phoneDisplay.replace(/[^\d,]/g, ""),
      Link: link, Notes: notes,
    };
    sheetRowsById[id] = row;
    postSheetRow(row);
  } else {
    const newListing = {
      id, custom: true, rating, neighborhood, rent, sqft, level, owner, fee: "", elevator: false,
      features: [], notes, link: link || undefined, contactName, phoneDisplay: phoneDisplay || undefined,
      tel: phoneDisplay ? phoneDisplay.replace(/[^\d,]/g, "") : undefined,
    };
    const custom = loadCustomListings();
    custom.push(newListing);
    if (!saveCustomListings(custom)) return;
  }

  addPanel.reset();
  addPanel.classList.remove("open");
  addToggle.textContent = "+ Add a new place";
  render();
});

function init() {
  // Render immediately with whatever's cached locally so the page never looks blank
  // or stuck — the Google Sheet round-trip can take a few seconds, especially on a
  // cold start, so we don't want the user staring at nothing while it loads.
  if (sheetConfigured()) {
    showSyncBanner("⏳ Loading latest data from Google Sheets…");
  } else {
    showSyncBanner("⚠️ Not connected to Google Sheets yet — changes only save on this device until setup is finished.");
  }
  render();

  if (sheetConfigured()) {
    fetchSheetData().then(rows => {
      if (rows) {
        sheetRowsById = indexRows(rows);
        sheetAvailable = true;
        showSyncBanner(null);
      } else {
        sheetAvailable = false;
        showSyncBanner("⚠️ Couldn't reach the Google Sheet right now — showing what's saved on this device instead.");
      }
      render();
    });
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && sheetConfigured()) {
    fetchSheetData().then(rows => {
      if (rows) {
        sheetRowsById = indexRows(rows);
        sheetAvailable = true;
        showSyncBanner(null);
        render();
      }
    });
  }
});

init();
</script>

</body>
</html>
