<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Appointments — Apartment Hunt</title>
<style>
  :root {
    --top-pick: #e03e3e;
    --very: #dfab01;
    --somewhat: #337ea9;
    --bg: #faf9f7;
    --card: #ffffff;
    --text: #2f2f2f;
    --muted: #767676;
    --border: #e6e4e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    padding: 28px 20px 14px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
  }
  header p {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .nav-link {
    display: inline-block;
    font-size: 0.82rem;
    color: #1c6fd1;
    text-decoration: none;
  }
  .sync-banner {
    max-width: 640px;
    margin: 0 auto 16px;
    padding: 10px 16px;
    background: #fff3cd;
    border: 1px solid #d4a017;
    color: #8a6400;
    font-size: 0.82rem;
    border-radius: 10px;
    text-align: center;
  }
  .stats-row {
    max-width: 640px;
    margin: 0 auto 20px;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-pill b { font-size: 0.95rem; }
  .agenda {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .section-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .date-group.today {
    border-color: #dfab01;
    background: #fffdf5;
  }
  .date-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 0 10px;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .date-heading .rel {
    font-weight: 500;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .count-badge {
    background: var(--text);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .date-group.today .count-badge {
    background: #dfab01;
    color: #3a2e00;
  }
  .appt-item {
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .appt-item:first-child { border-top: none; padding-top: 0; }
  .appt-item-main {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .appt-item-sub { cursor: pointer; }
  .expand-caret {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.7rem;
  }
  .appt-detail-panel {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .appt-detail-line {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .appt-prenote {
    font-style: italic;
  }
  .appt-detail-panel label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    margin-top: 2px;
  }
  .appt-detail-panel input[type="date"],
  .appt-detail-panel textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.88rem;
    font-family: inherit;
    resize: vertical;
  }
  .appt-detail-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .appt-save-btn, .appt-cancel-btn {
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .appt-save-btn { background: #1c6fd1; color: #fff; }
  .appt-cancel-btn { background: #f0efec; color: var(--text); }
  .rating-dot {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 20px;
    color: #fff;
    white-space: nowrap;
  }
  .rating-dot.top { background: var(--top-pick); }
  .rating-dot.very { background: var(--very); color: #3a2e00; }
  .rating-dot.somewhat { background: var(--somewhat); }
  .appt-rent { font-weight: 700; }
  .appt-neighborhood { color: var(--muted); font-size: 0.85rem; }
  .decision-tag {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 20px;
  }
  .decision-tag.take { background: #ddf3e4; color: #1d6b2d; }
  .decision-tag.unsure { background: #fff3cd; color: #8a6400; }
  .appt-item-sub {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .appt-item-sub a {
    color: #1c6fd1;
    text-decoration: none;
    font-weight: 600;
  }
  .appt-item-sub .call-btn {
    background: #eef5ff;
    color: #1b5fb0;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
    padding: 20px 16px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  details.past-section summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 4px 0;
    color: var(--muted);
  }
  details.past-section[open] summary { color: var(--text); margin-bottom: 8px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 30px;
  }
</style>
</head>
<body>

<header>
  <h1>📅 Appointment Schedule</h1>
  <p>Who you're visiting, and when — grouped by date so you can see what's left to plan.</p>
  <a class="nav-link" href="index.html">← Back to full list</a>
</header>

<div class="sync-banner" id="sync-banner" style="display:none;"></div>

<div class="stats-row" id="stats-row"></div>

<div class="agenda" id="agenda"></div>

<footer>Made with 💛 for apartment hunting </footer>

<script>
const listings = [
  { id: "22109937", rating: "Top pick", neighborhood: "Xindian", rent: 12000, sqft: 5, level: "3F/4F", owner: "Owner", fee: "No-Fee", elevator: false, features: ["washing machine","Water Machine","rent-stabilized"], notes: "", contactName: "曾小姐", phoneDisplay: "0972-528-577 ext 4726653", tel: "0972528577,4726653" },
  { id: "22100813", rating: "Very interested", neighborhood: "Xindian", rent: 12500, sqft: 10, level: "2F/3F", owner: "Owner", fee: "Water Free", elevator: false, features: ["washing machine (share)"], notes: "", contactName: "龔女士", phoneDisplay: "0935-920-910", tel: "0935920910" },
  { id: "22097513", rating: "Very interested", neighborhood: "Xindian", rent: 13500, sqft: 8, level: "", owner: "Agent", fee: "", elevator: false, features: ["washing machine","Water Machine"], notes: "", contactName: "崔小姐", phoneDisplay: "0918-666-444", tel: "0918666444", lineId: "0918666444", lineType: "personal" },
  { id: "22135508", rating: "Very interested", neighborhood: "Xindian", rent: 10000, sqft: 5, level: "1F", owner: "Owner", fee: "", elevator: false, features: ["washing machine"], notes: "", contactName: "黃先生", phoneDisplay: "0972-528-577 ext 4725739", tel: "0972528577,4725739" },
  { id: "22100737", rating: "Very interested", neighborhood: "Xindian", rent: 11000, sqft: 8, level: "2F", owner: "Owner", fee: "", elevator: false, features: ["washing machine"], notes: "", contactName: "0先生", phoneDisplay: "0972-528-577 ext 4725751", tel: "0972528577,4725751" },
  { id: "22056915", rating: "Somewhat interested", neighborhood: "Xindian", rent: 8500, sqft: 9, level: "1F", owner: "Owner", fee: "No-Fee", elevator: false, features: [], notes: "", contactName: "呂先生", phoneDisplay: "0988-215-941", tel: "0988215941" },
  { id: "22038129", rating: "Somewhat interested", neighborhood: "Xindian", rent: 8000, sqft: 8, level: "頂層加蓋/1F", owner: "Owner", fee: "No-Fee", elevator: false, features: ["washing machine","rent-stabilized"], notes: "", contactName: "蔡先生", phoneDisplay: "0972-528-577 ext 4718484", tel: "0972528577,4718484" },
  { id: "22101540", rating: "Somewhat interested", neighborhood: "Xindian", rent: 11300, sqft: 6, level: "4F", owner: "Agent", fee: "?", elevator: false, features: ["washing machine"], notes: "", contactName: "張先生", phoneDisplay: "0939-100-187", tel: "0939100187", lineId: "quv4409a", lineType: "official" },
  { id: "22064039", rating: "Somewhat interested", neighborhood: "Xindian", rent: 16800, sqft: null, level: "3F", owner: "Owner", fee: "", elevator: false, features: [], notes: "Shared Bathroom", contactName: "張先生", phoneDisplay: "0920-022-682", tel: "0920022682" },
  { id: "22103904", rating: "Somewhat interested", neighborhood: "Xindian", rent: 8500, sqft: 7, level: "5F", owner: "Owner", fee: "?", elevator: false, features: [], notes: "", contactName: "李小姐", phoneDisplay: "0972-281-522", tel: "0972281522" },
  { id: "22138815", rating: "Somewhat interested", neighborhood: "Xindian", rent: 15000, sqft: 10, level: "6F", owner: "Agent", fee: "Fee", elevator: true, features: [], notes: "Need to pay Agent fee / service fee: half a month's rent", contactName: "游先生 (Eason)", phoneDisplay: "0970-104-204", tel: "0970104204", lineId: "d10220112", lineType: "personal" },
];

const ratingClass = { "Top pick": "top", "Very interested": "very", "Somewhat interested": "somewhat" };
const ratingRank = { "Top pick": 0, "Very interested": 1, "Somewhat interested": 2 };
const editingIds = new Set(); // ids currently showing their expanded detail/notes panel
let listingsById = {}; // refreshed each buildAgenda() — lets click handlers look up a listing by id

// ---- Google Sheets sync (read-only on this page — editing still happens on index.html) ----
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyR9WcKTX3QuJewSt_dUHgIjLWdf0JH3QAyB9AARAYShIK8xfZ67aED8IkSBp76y20/exec";
const sheetConfigured = () => !!SHEET_API_URL;

let sheetRowsById = {};
let sheetAvailable = false;

// Defensive guard: if the Sheet's Date column ever gets auto-converted to a
// real date type (Google Sheets does this silently for "yyyy-MM-dd"-looking
// text), Apps Script may hand it back as a timestamp-ish string instead of
// plain yyyy-MM-dd. Normalize so date math and grouping always get the
// format they expect, regardless of what the backend sent.
function normalizeDateStr(v) {
  if (!v) return "";
  const s = String(v);
  // Only trust a bare yyyy-MM-dd. A full timestamp like
  // "2026-10-11T17:00:00.000Z" is midnight Monday in Thailand but its first
  // 10 characters are the UTC date (Sunday), so parse it as a real Date and
  // read the local calendar date instead.
  const plain = s.match(/^(\d{4}-\d{2}-\d{2})$/);
  if (plain) return plain[1];
  const parsed = new Date(s);
  if (!isNaN(parsed)) {
    return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
  }
  return "";
}

function indexRows(rows) {
  const map = {};
  rows.forEach(r => { if (r.ID !== undefined && r.ID !== "") map[String(r.ID)] = r; });
  return map;
}

async function fetchSheetDataOnce() {
  const res = await fetch(SHEET_API_URL, { cache: "no-store" });
  if (!res.ok) throw new Error("bad response: " + res.status);
  const rows = await res.json();
  return Array.isArray(rows) ? rows : [];
}

// Google Apps Script's web app occasionally glitches on a single request
// (its response is itself a redirect to a one-time URL, and that hop can
// fail transiently). Retry a couple of times with a short delay before
// giving up, and log the real error to the console so it's debuggable
// via DevTools instead of just silently falling back to local data.
async function fetchSheetData(attempt = 1) {
  try {
    return await fetchSheetDataOnce();
  } catch (e) {
    console.error(`fetchSheetData attempt ${attempt} failed:`, e);
    if (attempt < 3) {
      await new Promise(r => setTimeout(r, 600 * attempt));
      return fetchSheetData(attempt + 1);
    }
    return null;
  }
}

function showSyncBanner(text, opts = {}) {
  const banner = document.getElementById("sync-banner");
  if (!text) { banner.innerHTML = ""; banner.style.display = "none"; return; }
  banner.innerHTML = escapeHtml(text) + (opts.retry ? ' <button id="retry-sync-btn" style="margin-left:8px;cursor:pointer;">🔄 Retry</button>' : "");
  banner.style.display = "block";
}

document.getElementById("sync-banner").addEventListener("click", (e) => {
  if (e.target && e.target.id === "retry-sync-btn") syncFromSheet();
});

function syncFromSheet() {
  showSyncBanner("⏳ Loading latest data from Google Sheets…");
  return fetchSheetData().then(rows => {
    if (rows) {
      sheetRowsById = indexRows(rows);
      sheetAvailable = true;
      showSyncBanner(null);
    } else {
      sheetAvailable = false;
      showSyncBanner("⚠️ Couldn't reach the Google Sheet right now — showing what's saved on this device instead.", { retry: true });
    }
    buildAgenda();
  });
}

function sheetRowToListing(r) {
  return {
    id: String(r.ID),
    custom: true,
    rating: r.Rating || "Somewhat interested",
    neighborhood: r.Neighborhood || "",
    rent: Number(r.Rent) || 0,
    sqft: r.Sqft ? Number(r.Sqft) : null,
    level: r.Level || "",
    owner: r.Owner || "",
    notes: r.Notes || "",
    link: r.Link || undefined,
    contactName: r.ContactName || "",
    phoneDisplay: r.PhoneDisplay || undefined,
    tel: r.PhoneDisplay ? String(r.PhoneDisplay).replace(/[^\d,]/g, "") : undefined,
  };
}

const storeKey = id => `apt-hunt-${id}`;

function loadState(id, defaultRating, defaultPreNote) {
  if (sheetAvailable && sheetRowsById[id]) {
    const r = sheetRowsById[id];
    return {
      date: normalizeDateStr(r.Date),
      note: r.Note || "",
      preNote: r.PreNote || defaultPreNote || "",
      decision: r.Decision || "",
      rating: r.Rating || defaultRating,
      deleted: r.Deleted === true || r.Deleted === "TRUE" || r.Deleted === "true",
    };
  }
  try {
    const stored = JSON.parse(localStorage.getItem(storeKey(id)));
    return stored || { date: "", note: "", decision: "", rating: defaultRating, preNote: defaultPreNote || "" };
  } catch (e) {
    return { date: "", note: "", decision: "", rating: defaultRating, preNote: defaultPreNote || "" };
  }
}

function postSheetRow(row) {
  if (!sheetConfigured()) return;
  // text/plain avoids a CORS preflight that Apps Script web apps don't handle.
  fetch(SHEET_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(row),
  }).catch(() => { /* silent — local cache below still has the latest value */ });
}

function saveApptState(id, updates) {
  const prev = loadState(id, updates.rating);
  const next = Object.assign({}, prev, updates);
  try {
    localStorage.setItem(storeKey(id), JSON.stringify(next));
  } catch (e) { /* best effort — sheet write below still goes through if configured */ }
  if (sheetConfigured()) {
    const row = Object.assign({}, sheetRowsById[id], {
      ID: id,
      Rating: next.rating,
      Decision: next.decision,
      Date: next.date,
      Note: next.note,
      PreNote: next.preNote,
      Deleted: !!next.deleted,
    });
    sheetRowsById[id] = row;
    postSheetRow(row);
  }
}

const CUSTOM_KEY = "apt-hunt-custom-list";

function loadCustomListings() {
  if (sheetAvailable) {
    return Object.values(sheetRowsById)
      .filter(r => (r.Custom === true || r.Custom === "TRUE") && !listings.some(l => l.id === String(r.ID)))
      .map(sheetRowToListing);
  }
  try {
    const stored = JSON.parse(localStorage.getItem(CUSTOM_KEY));
    return Array.isArray(stored) ? stored : [];
  } catch (e) {
    return [];
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatDateHeading(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((d - today) / 86400000);
  const weekday = d.toLocaleDateString("en-US", { weekday: "long" });
  const monthDay = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  let rel;
  if (diffDays === 0) rel = "Today";
  else if (diffDays === 1) rel = "Tomorrow";
  else if (diffDays === -1) rel = "Yesterday";
  else if (diffDays < 0) rel = `${-diffDays} days ago`;
  else rel = `in ${diffDays} days`;
  return { label: `${weekday}, ${monthDay}`, rel, diffDays };
}

function apptItemHtml(l, state) {
  const link = l.link || `https://rent.591.com.tw/${l.id}`;
  const rating = state.rating || l.rating;
  const decisionTag = state.decision === "take" ? `<span class="decision-tag take">✅ Take it</span>`
    : state.decision === "unsure" ? `<span class="decision-tag unsure">🤔 Not sure</span>`
    : "";
  const expanded = editingIds.has(l.id);
  const detailBits = [
    l.sqft ? `${l.sqft} ping` : "",
    l.level || "",
    l.owner || "",
  ].filter(Boolean).join(" · ");
  return `
    <div class="appt-item" data-id="${l.id}">
      <div class="appt-item-main" data-toggle="${l.id}">
        <span class="rating-dot ${ratingClass[rating] || ""}">${escapeHtml(rating || "")}</span>
        <span class="appt-rent">NT$${(l.rent || 0).toLocaleString()}</span>
        ${l.neighborhood ? `<span class="appt-neighborhood">📍 ${escapeHtml(l.neighborhood)}</span>` : ""}
        ${decisionTag}
        <span class="expand-caret">${expanded ? "▲" : "▼"}</span>
      </div>
      <div class="appt-item-sub" data-toggle="${l.id}">
        ${l.contactName || l.phoneDisplay ? `<span>${escapeHtml(l.contactName || "")}${l.contactName && l.phoneDisplay ? " · " : ""}${escapeHtml(l.phoneDisplay || "")}</span>` : ""}
        ${l.tel ? `<a class="call-btn" href="tel:${l.tel}">📞 Call</a>` : ""}
        <a href="${link}" target="_blank" rel="noopener">View listing →</a>
      </div>
      ${expanded ? `
        <div class="appt-detail-panel">
          ${detailBits ? `<div class="appt-detail-line">${escapeHtml(detailBits)}</div>` : ""}
          ${state.preNote ? `<div class="appt-detail-line appt-prenote">${escapeHtml(state.preNote)}</div>` : ""}
          <label for="appt-date-${l.id}">Appointment date</label>
          <input type="date" id="appt-date-${l.id}" value="${state.date}">
          <label for="appt-note-${l.id}">Visit notes</label>
          <textarea id="appt-note-${l.id}" rows="3" placeholder="How did the visit go?">${escapeHtml(state.note || "")}</textarea>
          <div class="appt-detail-actions">
            <button class="appt-save-btn" data-save="${l.id}">💾 Save</button>
            <button class="appt-cancel-btn" data-cancel="${l.id}">Cancel</button>
          </div>
        </div>
      ` : ""}
    </div>
  `;
}

async function buildAgenda() {
  const allListings = [...listings, ...loadCustomListings()];
  listingsById = {};
  allListings.forEach(l => { listingsById[l.id] = l; });
  const items = allListings
    .map(l => ({ l, state: loadState(l.id, l.rating, l.notes) }))
    .filter(({ state }) => !state.deleted);

  const passedOn = items.filter(({ state }) => state.decision === "leave");
  const active = items.filter(({ state }) => state.decision !== "leave");
  const scheduled = active.filter(({ state }) => state.date);
  const needsSchedule = active.filter(({ state }) => !state.date);

  const today = todayStr();
  const byDate = {};
  scheduled.forEach(item => {
    (byDate[item.state.date] = byDate[item.state.date] || []).push(item);
  });
  const sortedDates = Object.keys(byDate).sort();
  const upcomingDates = sortedDates.filter(d => d >= today);
  const pastDates = sortedDates.filter(d => d < today);

  const sortByRating = (a, b) => (ratingRank[a.state.rating || a.l.rating] ?? 9) - (ratingRank[b.state.rating || b.l.rating] ?? 9);

  // ---- stats ----
  const statsEl = document.getElementById("stats-row");
  statsEl.innerHTML = `
    <div class="stat-pill">🗓️ <b>${scheduled.length}</b> appointment${scheduled.length === 1 ? "" : "s"} scheduled</div>
    <div class="stat-pill">❓ <b>${needsSchedule.length}</b> still need a date</div>
    <div class="stat-pill">🙅 <b>${passedOn.length}</b> passed on</div>
  `;

  // ---- agenda sections ----
  const agendaEl = document.getElementById("agenda");
  let html = "";

  html += `<div><h2 class="section-title">📍 Upcoming appointments</h2>`;
  if (upcomingDates.length === 0) {
    html += `<div class="empty-state">No appointments scheduled yet. Pick a place below and set a date for it on the main list.</div>`;
  } else {
    upcomingDates.forEach(date => {
      const { label, rel, diffDays } = formatDateHeading(date);
      const dayItems = byDate[date].slice().sort(sortByRating);
      html += `
        <div class="date-group ${diffDays === 0 ? "today" : ""}">
          <div class="date-heading">
            <span>${label} <span class="rel">· ${rel}</span></span>
            <span class="count-badge">${dayItems.length} place${dayItems.length === 1 ? "" : "s"}</span>
          </div>
          ${dayItems.map(({ l, state }) => apptItemHtml(l, state)).join("")}
        </div>
      `;
    });
  }
  html += `</div>`;

  html += `<div><h2 class="section-title">⏳ Still need to schedule</h2>`;
  if (needsSchedule.length === 0) {
    html += `<div class="empty-state">Everything you're still considering already has a date. 🎉</div>`;
  } else {
    const sortedNeeds = needsSchedule.slice().sort(sortByRating);
    html += `<div class="date-group">${sortedNeeds.map(({ l, state }) => apptItemHtml(l, state)).join("")}</div>`;
  }
  html += `</div>`;

  if (pastDates.length > 0) {
    html += `
      <details class="past-section">
        <summary>✅ Past appointments (${pastDates.reduce((n, d) => n + byDate[d].length, 0)})</summary>
        ${pastDates.map(date => {
          const { label, rel } = formatDateHeading(date);
          const dayItems = byDate[date].slice().sort(sortByRating);
          return `
            <div class="date-group">
              <div class="date-heading">
                <span>${label} <span class="rel">· ${rel}</span></span>
                <span class="count-badge">${dayItems.length} place${dayItems.length === 1 ? "" : "s"}</span>
              </div>
              ${dayItems.map(({ l, state }) => apptItemHtml(l, state)).join("")}
            </div>
          `;
        }).join("")}
      </details>
    `;
  }

  if (passedOn.length > 0) {
    html += `
      <details class="past-section">
        <summary>🙅 Passed on (${passedOn.length})</summary>
        <div class="date-group">${passedOn.map(({ l, state }) => apptItemHtml(l, state)).join("")}</div>
      </details>
    `;
  }

  agendaEl.innerHTML = html;

  agendaEl.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("a")) return; // let Call / View listing links work normally
      const id = el.dataset.toggle;
      if (editingIds.has(id)) editingIds.delete(id); else editingIds.add(id);
      buildAgenda();
    });
  });

  agendaEl.querySelectorAll("[data-save]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.save;
      const l = listingsById[id];
      const dateInput = document.getElementById(`appt-date-${id}`);
      const noteInput = document.getElementById(`appt-note-${id}`);
      const prev = loadState(id, l ? l.rating : undefined, l ? l.notes : undefined);
      saveApptState(id, { date: dateInput.value, note: noteInput.value, rating: prev.rating, decision: prev.decision, preNote: prev.preNote, deleted: prev.deleted });
      editingIds.delete(id);
      buildAgenda();
    });
  });

  agendaEl.querySelectorAll("[data-cancel]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      editingIds.delete(btn.dataset.cancel);
      buildAgenda();
    });
  });
}

function init() {
  if (sheetConfigured()) {
    showSyncBanner("⏳ Loading latest data from Google Sheets…");
  } else {
    showSyncBanner("⚠️ Not connected to Google Sheets yet — showing what's saved on this device only.");
  }
  buildAgenda();

  if (sheetConfigured()) {
    syncFromSheet();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && sheetConfigured()) {
    fetchSheetData().then(rows => {
      if (rows) {
        sheetRowsById = indexRows(rows);
        sheetAvailable = true;
        showSyncBanner(null);
        buildAgenda();
      }
    });
  }
});

init();
</script>
</body>
</html>
